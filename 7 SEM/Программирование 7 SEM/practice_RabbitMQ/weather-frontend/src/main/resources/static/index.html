<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Weather Aggregator</title>
    <style>
        body { font-family: sans-serif; margin: 50px; line-height: 1.6; }
        .container { max-width: 600px; margin: auto; }
        textarea { width: 100%; height: 100px; margin-bottom: 10px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; }
        #result { margin-top: 20px; padding: 15px; background: #f8f9fa; border-left: 5px solid #007bff; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Агрегатор погоды</h1>
        <p>Введите названия городов через запятую:</p>
        <textarea id="citiesInput" placeholder="Moscow, London, Tokyo"></textarea>
        <button onclick="sendRequest()">Запросить погоду</button>

        <div id="result" style="display:none;">
            <strong>Статус:</strong> <span id="status"></span><br>
            <strong>ID запроса:</strong> <span id="corrId"></span>
            <p><small>Проверьте логи Aggregator Service для просмотра собранного отчета.</small></p>
        </div>
    </div>

    <script>
        async function sendRequest() {
            const input = document.getElementById('citiesInput').value;
            const cities = input.split(',').map(c => c.trim()).filter(c => c !== "");
            
            try {
                const response = await fetch('http://localhost:8080/api/weather/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(cities)
                });
                const text = await response.text();
                
                document.getElementById('result').style.display = 'block';
                document.getElementById('status').innerText = "Запрос отправлен в RabbitMQ";
                document.getElementById('corrId').innerText = text;
            } catch (e) {
                alert("Ошибка: Убедитесь, что weather-api-service запущен на порту 8080");
            }
        }
    </script>
</body>
</html>
